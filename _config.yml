# ============================================
# SITE SETTINGS — edit the values on the right
# ============================================
title: "Your Name"                     # TODO: replace with your name
tagline: "Pastor. Strategist. Builder of people."
description: >-
  Reflections on faith, character, and leadership — from the pulpit
  to the boardroom. Notes on integrity in business, building teams,
  and the discipline it takes to do both well.

email: you@example.com                 # TODO
linkedin: https://linkedin.com/in/your-handle   # TODO
url: "https://your-username.github.io"          # TODO: your Pages URL
baseurl: ""                            # keep "" for a user/org site
                                        # (username.github.io repo);
                                        # set to "/repo-name" for a
                                        # project site

# What the throughline motif labels each section with —
# change freely, this is the spine of your brand.
throughline:
  - Integrity
  - Character
  - Discipline
  - Leadership

# ---- Jekyll internals — leave as is ----
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
